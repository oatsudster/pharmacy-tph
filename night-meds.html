<style>
:root {
  --primary: #1A5E38; --primary-dark: #124228; --primary-light: #EAF4EE;
  --gold: #C49A22; --gold-light: #FBF3DC;
  --bg: #F4F7F5; --surface: #ffffff; --border: #D6E4DA;
  --text: #1C2B22; --text-mid: #3D5A47; --text-light: #7A9A85;
  --danger: #b91c1c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 15px; }
.topbar { background: var(--primary-dark); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar a { color: #fff; text-decoration: none; background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 8px; font-size: 13px; }
.topbar h1 { font-size: 18px; margin: 0; }
.topbar .sub { font-size: 12px; opacity: .8; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 10px; color: var(--primary-dark); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.controls label { font-size: 12px; color: var(--text-mid); display: block; margin-bottom: 3px; }
.controls input { font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; }
.btn { font: inherit; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn:disabled { opacity: .5; cursor: default; }
.hn-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
.hn-row label { font-size: 13px; color: var(--text-mid); display: block; margin-bottom: 4px; }
.hn-row input { font: inherit; font-size: 18px; padding: 7px 12px; border: 2px solid var(--gold); border-radius: 8px; width: 180px; }
.hn-msg { font-size: 14px; align-self: center; }
.window-note { font-size: 13px; color: var(--text-mid); margin-top: 8px; }
.status { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--gold-light); margin-bottom: 14px; display: none; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.stat .n { font-size: 22px; font-weight: 800; color: var(--primary); }
.stat .l { font-size: 12px; color: var(--text-light); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tab { font: inherit; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 8px; border-bottom: 1px solid #eef3ef; text-align: left; vertical-align: top; }
th { background: var(--primary-light); font-size: 13px; color: var(--primary-dark); }
td.num, th.num { text-align: right; white-space: nowrap; }
.grp td { background: #fafcfb; font-weight: 700; color: var(--text-mid); font-size: 13px; }
.pt { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.pt-head { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--primary-light); flex-wrap: wrap; }
.pt-head .nm { font-weight: 700; }
.pt-head .meta { font-size: 13px; color: var(--text-mid); }
.pt-head .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--border); }
.pt-head .badge.ipd { background: #fef3c7; border-color: #fcd34d; }
.pt-head label { margin-left: auto; font-size: 13px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
.pt table td { font-size: 14px; }
tr.off td { color: #9aa9a0; text-decoration: line-through; }
tr.off td.why, tr.off td:first-child { text-decoration: none; }
td.why { font-size: 12px; color: var(--text-light); }
.opts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-mid); margin-top: 10px; }
.empty { text-align: center; color: var(--text-light); padding: 24px; }
#print-area { display: none; }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* ── สติกเกอร์ 9×6 ซม. ต่อผู้ป่วย 1 คน (ยาเยอะ → ต่อดวงถัดไป) ── */
.sticker { width: 90mm; height: 60mm; padding: 2.5mm 3mm; overflow: hidden; page-break-after: always; break-after: page;
  font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; color: #000; display: flex; flex-direction: column; }
.sticker:last-child { page-break-after: auto; break-after: auto; }
.sticker .h1 { font-size: 10pt; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticker .h2 { font-size: 7.5pt; line-height: 1.25; border-bottom: .3mm solid #000; padding-bottom: .8mm; margin-bottom: .8mm; display: flex; justify-content: space-between; gap: 2mm; }
.sticker table { width: 100%; border-collapse: collapse; }
.sticker td { font-size: 8pt; line-height: 1.22; padding: .15mm 0; border: 0; vertical-align: top; }
.sticker td.q { text-align: right; white-space: nowrap; padding-left: 1.5mm; font-weight: 700; }
.sticker .ft { margin-top: auto; font-size: 6.5pt; color: #333; text-align: right; }

/* ── สรุปรวม A4 ── */
.sum-print h3 { font-size: 13pt; margin: 0 0 2mm; }
.sum-print .sub { font-size: 9pt; margin-bottom: 3mm; }
.sum-print td, .sum-print th { font-size: 10pt; padding: 1.2mm 2mm; border: .2mm solid #999; background: none; color: #000; }

@media print {
  body { background: #fff; }
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block; }
}
</style>

<body data-suite-page="night-meds">

<div class="topbar">
  <a href="index.html">🏠 หน้าหลัก</a>
  <div>
    <h1>🌙 ยาที่ใช้เวรบ่าย-ดึก (คืนรถยา)</h1>
    <div class="sub">ใบสั่งยาผู้ป่วยนอก/ER + ยาแรกรับผู้ป่วย admit · ดึงจาก HOSxP</div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="controls">
      <div><label for="f-date">เช้าวันที่ (สิ้นสุดเวร)</label><input type="date" id="f-date"></div>
      <div><label for="f-from">ตั้งแต่ (เมื่อวาน)</label><input type="time" id="f-from" value="19:30"></div>

      <button class="btn btn-gold" id="btn-sticker" onclick="printStickers()" disabled>🖨 พิมพ์สติกเกอร์ทุกคน (9×6 ซม.)</button>
      <button class="btn" id="btn-sum" onclick="printSummary()" disabled>🖨 พิมพ์สรุปรวม (สติกเกอร์ 9×6)</button>
    </div>
    <div class="hn-row">
      <label for="f-hn">🔎 พิมพ์ทีละใบ: ใส่/สแกน HN จากใบสั่งยา แล้วกด Enter → พิมพ์สติกเกอร์ของคนนั้นทันที</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="f-hn" inputmode="numeric" placeholder="HN" autocomplete="off">
        <button class="btn btn-gold" onclick="printByHn()">🖨 พิมพ์ HN นี้</button>
        <span id="hn-msg" class="hn-msg"></span>
      </div>
    </div>
    <div class="window-note" id="window-note"></div>
    <div class="opts">

  <div class="status" id="status"></div>

  <div class="stats" id="stats" style="display:none">

    <div class="stat"><div class="n" id="st-ipd">0</div><div class="l">admit (ยาแรกรับ)</div></div>
    <div class="stat"><div class="n" id="st-drug">0</div><div class="l">รายการยาไม่ซ้ำ</div></div>

    <div id="view-pt"></div>
    <div id="view-sum" style="display:none"></div>
  </div>
</div>

<div id="print-area"></div>

<script>
// ── กติกาคัดยาที่ต้องคืนรถยา (ตามที่เภสัชกำหนด) ──
// เอา: ยาทุกชนิด ยาเม็ด ยาน้ำ ยาหยอดตา ยาฉีด น้ำเกลือขวด 1000 ml ที่สั่งใน ER/หอผู้ป่วยช่วงเวร
// ไม่เอา: ยาพ่น (NB/MDI/inhaler), น้ำเกลือขวด 100 ml, ยาเดิมของผู้ป่วย, ของที่ไม่ใช่ยา,
//         ยาของผู้ป่วยในเดิม (ไม่ได้ admit ในเวรนี้ — order หอผู้ป่วยช่วงหัวค่ำที่ห้องจ่ายยายังเปิด) — ยาแรกรับที่สั่งจาก ER นับเสมอ
// รายการ OPD ที่คีย์ในนามห้องจ่ายยา (030) ตอนกลางดึกก็นับ เพราะห้องจ่ายยาปิดแล้ว ยามาจากรถยา
const ER_DEP = '002';
const RE_INHALE = /\bNB\b|\bMDI\b|inhaler|nebul|BERODUAL|evohaler|accuhaler|turbuhaler/i;
const RE_SMALL_NSS = /\b(50|100)\s*(ซีซี|ml|cc)/i;
const RE_NSS = /\bNSS\b|saline|sodium\s*chloride|NaCl/i;
const RE_VACCINE = /vaccin|วัคซีน|VERORAB|\bERIG\b|PCEC|antiserum|antivenum|เซรุ่ม|\bBCG\b|\bDTP?\b|\bdT\b|influenza|\bHPV\b|\bMMR\b|\bJE\b|\bOPV\b|\bIPV\b|ROTA/i;

const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thD = iso => { const [y, m, d] = String(iso || '').split('-').map(Number); return y ? `${d} ${TH_M[m - 1]} ${String(y + 543).slice(-2)}` : ''; };
const fmtQty = q => { const n = +q; return Number.isInteger(n) ? String(n) : n.toLocaleString('th-TH', { maximumFractionDigits: 2 }); };

let DATA = null;          // ผลจาก /db/nightmeds
let ITEMS = [];           // รายการยาพร้อมสถานะ include/why
const OVERRIDE = {};      // index → true/false ที่ติ๊กแก้เอง
const NO_STICKER = {};    // key ผู้ป่วยที่ไม่ต้องพิมพ์สติกเกอร์

function todayISO() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' }); }
function drugLabel(it) {
  const n = String(it.drug || '').trim(), s = String(it.strength || '').trim();
  return s && s !== '.' && s !== 'mg.' && !n.toLowerCase().includes(s.toLowerCase()) ? `${n} ${s}` : n;
}
function formGroup(it) {
  const f = String(it.form || '').toUpperCase(), u = String(it.units || ''), t = f + ' ' + String(it.drug || '');
  if (/INTRAVENOUS/.test(f) || (/INJECT/.test(f) && /1,?000/.test(u))) return [4, '💧 สารน้ำ/น้ำเกลือ'];
  if (/INJECT/.test(f) || (/POWDER/.test(f) && /vial|ไวอัล/i.test(u))) return [3, '💉 ยาฉีด'];
  if (/TABLET|CAPSULE/.test(f)) return [1, '💊 ยาเม็ด/แคปซูล'];
  if (/EYE|EAR|OPH/.test(t)) return [5, '👁 ยาหยอดตา/หู'];
  if (/SYRUP|SUSP|SOLUTION|ELIXIR|DRY|DROP/.test(f)) return [2, '🧴 ยาน้ำ'];
  return [6, '📦 อื่นๆ'];
}
function classify(it, win) {
  const txt = [it.drug, it.form, it.units].join(' ');
  if (!it.form) return [false, 'ไม่ใช่ยา (เช่น ขวดยา)'];
  if (/^ยาเดิม/.test(String(it.drug || '').trim())) return [false, 'ยาเดิมของผู้ป่วย'];
  if (it.an && it.dep !== ER_DEP) {
    const reg = it.regdate && it.regtime ? `${it.regdate} ${it.regtime}` : '';
    if (!reg || reg < win.from || reg >= win.to) return [false, 'ผู้ป่วยในเดิม (ไม่ใช่ยาแรกรับ)'];
  }
  if (RE_INHALE.test(txt)) return [false, 'ยาพ่น'];
  if (RE_NSS.test(txt) && RE_SMALL_NSS.test(it.units || '')) return [false, 'น้ำเกลือขวด 100 ml'];
  if (RE_VACCINE.test(txt) && !document.getElementById('opt-vaccine').checked) return [false, 'วัคซีน/เซรุ่ม'];
  return [true, ''];
}
function windowOf() {
  const d = document.getElementById('f-date').value || todayISO();
  const prev = new Date(d + 'T12:00:00'); prev.setDate(prev.getDate() - 1);
  const p = prev.toLocaleDateString('en-CA');
  return { date: d, prev: p, from: `${p} ${document.getElementById('f-from').value || '19:30'}`, to: `${d} ${document.getElementById('f-to').value || '08:00'}` };
}
function showStatus(msg) { const el = document.getElementById('status'); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }

async function load() {
  const w = windowOf();
  document.getElementById('window-note').textContent =
    `ช่วงเวลา: ${thD(w.prev)} ${w.from.slice(11)} น. → ${thD(w.date)} ${w.to.slice(11)} น.`;
  const btn = document.getElementById('btn-load');
  btn.disabled = true; btn.textContent = '⏳ กำลังดึง…';
  showStatus('');
  try {
    if (!window.tphHosxp || !tphHosxp.nightMeds) throw new Error('nobridge');
    const r = await tphHosxp.nightMeds(w.date, w.from.slice(11), w.to.slice(11));
    if (!r) throw new Error('nobridge');
    DATA = r;
    Object.keys(OVERRIDE).forEach(k => delete OVERRIDE[k]);
    Object.keys(NO_STICKER).forEach(k => delete NO_STICKER[k]);
    reclassify();
  } catch (e) {
    showStatus('⚠️ ต่อ HOSxP ไม่ได้ — ใช้ได้เฉพาะเครื่องใน รพ. ที่เปิด HOSxP Bridge ตัวใหม่ (มีไฟล์ db.json)');
  } finally {
    btn.disabled = false; btn.textContent = '🗄 ดึงจาก HOSxP';
  }
}

function reclassify() {
  if (!DATA) return;
  const w = windowOf();
  ITEMS = (DATA.items || []).map((it, i) => {
    const [inc, why] = classify(it, w);
    return Object.assign({}, it, { i, auto: inc, why, include: i in OVERRIDE ? OVERRIDE[i] : inc, key: it.an || it.vn || it.hn });
  });
  render();
}

function patients() {
  const map = new Map();
  ITEMS.forEach(it => {
    if (!map.has(it.key)) map.set(it.key, { key: it.key, hn: it.hn, name: it.name, an: it.an, vn: it.vn, ward: it.ward,
      regdate: it.regdate, regtime: it.regtime, first: `${it.date} ${it.time}`, dep: it.depName, items: [] });
    map.get(it.key).items.push(it);
  });
  return [...map.values()].sort((a, b) => a.first.localeCompare(b.first));
}
// รวมยาชนิดเดียวกันในใบสั่งเดียว (สั่งหลายครั้งในคืนเดียว)
function sumItems(items) {
  const m = new Map();
  items.filter(x => x.include).forEach(x => {
    const k = x.icode + '|' + x.units;
    if (!m.has(k)) m.set(k, { label: drugLabel(x), units: x.units, qty: 0, grp: formGroup(x), pts: new Set() });
    const r = m.get(k); r.qty += +x.qty || 0; r.pts.add(x.key);
  });
  return [...m.values()].sort((a, b) => a.grp[0] - b.grp[0] || a.label.localeCompare(b.label));
}

function render() {
  const pts = patients();
  const withDrugs = pts.filter(p => p.items.some(x => x.include));
  const all = sumItems(ITEMS);
  document.getElementById('stats').style.display = '';
  document.getElementById('result').style.display = '';
  document.getElementById('st-pt').textContent = withDrugs.length;
  document.getElementById('st-ipd').textContent = withDrugs.filter(p => p.an).length;
  document.getElementById('st-drug').textContent = all.length;
  document.getElementById('st-off').textContent = ITEMS.filter(x => !x.include).length;
  document.getElementById('btn-sticker').disabled = !withDrugs.length;
  document.getElementById('btn-sum').disabled = !all.length;

  // รายผู้ป่วย
  const vp = document.getElementById('view-pt');
  if (!pts.length) vp.innerHTML = '<div class="empty">ไม่พบใบสั่งยาในช่วงเวลานี้</div>';
  else vp.innerHTML = pts.map(p => {
    const has = p.items.some(x => x.include);
    const head = `<div class="pt-head">
        <span class="nm">${escHtml(p.name || '-')}</span>
        <span class="meta">HN ${escHtml(p.hn || '')}</span>
        ${p.an ? `<span class="badge ipd">admit AN ${escHtml(p.an)}${p.regtime ? ' · ' + escHtml(p.regtime) + ' น.' : ''}${p.ward ? ' · ' + escHtml(p.ward) : ''}</span>`
               : `<span class="badge">OPD · ${escHtml(p.dep || '')}</span>`}
        <span class="meta">${escHtml(thD(p.first.slice(0, 10)))} ${escHtml(p.first.slice(11))} น.</span>
        <label><input type="checkbox" ${has && !NO_STICKER[p.key] ? 'checked' : ''} ${has ? '' : 'disabled'}
          onchange="NO_STICKER[${escHtml(JSON.stringify(p.key))}]=!this.checked"> พิมพ์สติกเกอร์</label>
      </div>`;
    const rows = p.items.map(x => `<tr class="${x.include ? '' : 'off'}">
        <td style="width:28px"><input type="checkbox" ${x.include ? 'checked' : ''} onchange="toggleItem(${x.i},this.checked)" title="นับ/ไม่นับรายการนี้"></td>
        <td>${escHtml(drugLabel(x))}</td>
        <td class="num">${escHtml(fmtQty(x.qty))}</td>
        <td>${escHtml(x.units || '')}</td>
        <td class="why">${escHtml(x.include ? (x.auto ? '' : 'เพิ่มเอง') : (x.why || 'ติ๊กออกเอง'))} <span style="opacity:.6">${escHtml(x.time)}</span></td>
      </tr>`).join('');
    return `<div class="pt">${head}<table><tbody>${rows}</tbody></table></div>`;
  }).join('');

  // สรุปรวม
  const vs = document.getElementById('view-sum');
  vs.innerHTML = all.length ? summaryTable(all, false) : '<div class="empty">ไม่มียาที่ต้องคืนรถยา</div>';
}
function summaryTable(rows, forPrint) {
  let g = '';
  return `<table><thead><tr><th>ยา</th><th class="num">จำนวนรวม</th><th>หน่วย</th>${forPrint ? '' : '<th class="num">ผู้ป่วย</th>'}</tr></thead><tbody>` +
    rows.map(r => {
      let h = '';
      if (r.grp[1] !== g) { g = r.grp[1]; h = `<tr class="grp"><td colspan="${forPrint ? 3 : 4}">${escHtml(g)}</td></tr>`; }
      return h + `<tr><td>${escHtml(r.label)}</td><td class="num"><b>${escHtml(fmtQty(r.qty))}</b></td><td>${escHtml(r.units || '')}</td>` +
        (forPrint ? '' : `<td class="num">${r.pts.size}</td>`) + '</tr>';
    }).join('') + '</tbody></table>';
}
function toggleItem(i, on) { OVERRIDE[i] = on; reclassify(); }
function setView(v, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
  document.getElementById('view-pt').style.display = v === 'pt' ? '' : 'none';
  document.getElementById('view-sum').style.display = v === 'sum' ? '' : 'none';
}

// ── พิมพ์ ──
const PER_STICKER = 10; // บรรทัดยาต่อดวง (ตัวอักษร 8pt บนสติกเกอร์สูง 6 ซม.)
function printByHn() {
  const el = document.getElementById('f-hn'), msg = document.getElementById('hn-msg');
  const hn = el.value.replace(/\D/g, '');
  if (!hn) return;
  const keys = patients().filter(p => String(p.hn || '').replace(/^0+/, '') === hn.replace(/^0+/, '') && sumItems(p.items).length).map(p => p.key);
  if (!DATA) msg.textContent = '⚠️ ยังไม่ได้ดึงข้อมูลจาก HOSxP';
  else if (!keys.length) msg.textContent = `⚠️ ไม่พบยาที่ต้องคืนของ HN ${hn} ในช่วงเวลานี้`;
  else { msg.textContent = `✅ พิมพ์ HN ${hn} (${keys.length} ใบสั่ง)`; printStickers(keys); }
  el.value = ''; el.focus();
}
function printStickers(onlyKeys) {
  const pts = patients().filter(p => onlyKeys ? onlyKeys.includes(p.key) : !NO_STICKER[p.key]).map(p => Object.assign(p, { rows: sumItems(p.items) })).filter(p => p.rows.length);
  if (!pts.length) return;
  const html = pts.map(p => {
    const pages = [];
    for (let i = 0; i < p.rows.length; i += PER_STICKER) pages.push(p.rows.slice(i, i + PER_STICKER));
    return pages.map((rows, pi) => `<div class="sticker">
      <div class="h1">${escHtml(p.name || '-')} · HN ${escHtml(p.hn || '')}</div>
      <div class="h2"><span>${p.an ? 'ยาแรกรับ AN ' + escHtml(p.an) : 'OPD/ER'}</span>
        <span>${escHtml(thD(p.first.slice(0, 10)))} ${escHtml(p.first.slice(11))} น.${pages.length > 1 ? ` (${pi + 1}/${pages.length})` : ''}</span></div>
      <table>${rows.map(r => `<tr><td>${escHtml(r.label)}</td><td class="q">${escHtml(fmtQty(r.qty))} ${escHtml(shortUnit(r.units))}</td></tr>`).join('')}</table>
      <div class="ft">ยาที่ใช้ไป เวรบ่าย-ดึก · คืนรถยา</div>
    </div>`).join('');
  }).join('');
  doPrint(html, '@page { size: 90mm 60mm; margin: 0; }');
}
function shortUnit(u) { return String(u || '').replace(/\s*\(.*\)\s*$/, '').trim(); }
// สรุปรวมทั้งเวรลงสติกเกอร์ 9×6 ซม. (ดวงละ PER_STICKER รายการ เรียงตามกลุ่มยา ต่อดวงถัดไปพร้อมเลขหน้า)
function printSummary() {
  const w = windowOf(), rows = sumItems(ITEMS);
  if (!rows.length) return;
  const pages = [];
  for (let i = 0; i < rows.length; i += PER_STICKER) pages.push(rows.slice(i, i + PER_STICKER));
  const html = pages.map((pr, pi) => `<div class="sticker">
      <div class="h1">สรุปยาคืนรถยา เวรบ่าย-ดึก</div>
      <div class="h2"><span>${escHtml(thD(w.prev))} ${escHtml(w.from.slice(11))} → ${escHtml(thD(w.date))} ${escHtml(w.to.slice(11))} น.</span>
        <span>${document.getElementById('st-pt').textContent} ใบสั่ง${pages.length > 1 ? ` (${pi + 1}/${pages.length})` : ''}</span></div>
      <table>${pr.map(r => `<tr><td>${escHtml(r.label)}</td><td class="q">${escHtml(fmtQty(r.qty))} ${escHtml(shortUnit(r.units))}</td></tr>`).join('')}</table>
      <div class="ft">ยา ${rows.length} รายการ · กลุ่มงานเภสัชกรรม</div>
    </div>`).join('');
  doPrint(html, '@page { size: 90mm 60mm; margin: 0; }');
}
function doPrint(html, pageCss) {
  document.getElementById('print-area').innerHTML = html;
  document.getElementById('page-size').textContent = pageCss;
  setTimeout(() => window.print(), 50);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-date').value = todayISO();
  ['f-date', 'f-from', 'f-to'].forEach(id => document.getElementById(id).addEventListener('change', load));
  document.getElementById('f-hn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); printByHn(); } });
  load();
});
</script>
