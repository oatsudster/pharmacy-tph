name: เตือนลบข้อมูลคลินิกชุดเดิม (Telegram)

# ตรวจทุกวันจันทร์ — สคริปต์ไม่ส่งอะไรจนกว่าจะถึง 25 พ.ย. 69 และหยุดเตือนเองเมื่อลบ visitRecords เดิมแล้ว
# อ่านอย่างเดียว ไม่ลบข้อมูล (ดู .github/scripts/clinic-legacy-check.mjs)
on:
  schedule:
    - cron: '0 1 * * 1'   # 01:00 UTC วันจันทร์ = 08:00 น. ไทย (GitHub อาจหน่วงได้ 1-3 ชม.)
  workflow_dispatch: {}   # กดรันเองจากแท็บ Actions ได้

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/clinic-legacy-check.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
