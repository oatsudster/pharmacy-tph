name: แจ้งเตือนยาใกล้หมดอายุ (Telegram)

on:
  # ไม่ใช้ schedule ของ GitHub Actions แล้ว (ดีเลย์ไม่แน่นอน บางวันมาถึงเที่ยง-บ่ายโมง)
  # Cloudflare Worker cron (telegram-webhook/wrangler.toml) สั่งรันผ่าน workflow_dispatch ทุกวัน 08:30 น. ไทย
  # และคำสั่ง /check ใน Telegram ก็ใช้ช่องทางเดียวกัน — กดรันเองจากแท็บ Actions ได้ด้วย
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/notify-expiry.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
